<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucaflex Indústria de Cadeiras | Móveis para Escritório em Cuiabá</title>
  <meta name="description" content="Especialista em cadeiras ergonômicas NR-17, poltronas executivas e móveis corporativos sob medida direto da fábrica em Cuiabá - MT. Solicite seu orçamento via WhatsApp.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0b0f17;
      --bg-card: #111827;
      --bg-card-hover: #1a2234;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(34, 197, 94, 0.4);
      --primary: #10b981;
      --primary-hover: #059669;
      --whatsapp: #25d366;
      --whatsapp-hover: #1ebe5d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --gold: #f59e0b;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 22px;
      --shadow-soft: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 25px rgba(16, 185, 129, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Utilitários Visuais */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--primary);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin-bottom: 20px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: var(--primary);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--primary);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 28px;
      border-radius: var(--radius-md);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      border: none;
    }

    .btn-whatsapp {
      background: linear-gradient(135deg, var(--whatsapp), #16a34a);
      color: #ffffff;
      box-shadow: 0 4px 20px rgba(37, 211, 102, 0.35);
    }

    .btn-whatsapp:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(37, 211, 102, 0.5);
      background: linear-gradient(135deg, #2df075, var(--whatsapp));
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text-main);
      backdrop-filter: blur(10px);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .section-title-wrap {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 60px auto;
    }

    .section-title {
      font-size: clamp(2rem, 3.5vw, 2.75rem);
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-bottom: 16px;
      background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .section-subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    /* Navbar */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 100;
      background: rgba(11, 15, 23, 0.82);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      transition: all 0.3s ease;
    }

    .nav-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 80px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #fff;
    }

    .logo-icon {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #0b0f17;
      font-weight: 900;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: var(--primary);
    }

    .mobile-menu-btn {
      display: none;
      background: transparent;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    /* Hero */
    .hero {
      position: relative;
      padding: 170px 0 100px;
      overflow: hidden;
    }

    .hero-glow-1 {
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
      filter: blur(70px);
      z-index: -1;
      pointer-events: none;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 60px;
    }

    .hero-content h1 {
      font-size: clamp(2.5rem, 4.5vw, 3.8rem);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
    }

    .hero-content h1 span {
      background: linear-gradient(135deg, var(--primary) 0%, #34d399 50%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-content p {
      font-size: 1.15rem;
      color: var(--text-muted);
      margin-bottom: 36px;
      max-width: 580px;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 40px;
    }

    .social-proof-strip {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .stars-group {
      display: flex;
      color: var(--gold);
      font-size: 1.1rem;
    }

    .social-proof-text {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .social-proof-text strong {
      color: #fff;
    }

    .hero-visual {
      position: relative;
    }

    .hero-card {
      background: linear-gradient(145deg, rgba(25, 33, 50, 0.8), rgba(17, 24, 39, 0.95));
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(12px);
      position: relative;
    }

    .floating-feature {
      position: absolute;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-md);
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
      animation: float 4s ease-in-out infinite alternate;
    }

    .floating-feature.top-right {
      top: -20px;
      right: -20px;
    }

    .floating-feature.bottom-left {
      bottom: -20px;
      left: -20px;
      animation-delay: -2s;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }

    /* Categorias / Produtos */
    .products {
      padding: 100px 0;
      position: relative;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 28px;
    }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px 26px;
      transition: all 0.35s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .product-card:hover {
      transform: translateY(-6px);
      border-color: var(--border-focus);
      box-shadow: var(--shadow-glow);
      background: var(--bg-card-hover);
    }

    .product-icon {
      width: 58px;
      height: 58px;
      border-radius: 14px;
      background: rgba(16, 185, 129, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      margin-bottom: 24px;
      border: 1px solid rgba(16, 185, 129, 0.2);
    }

    .product-card h3 {
      font-size: 1.35rem;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .product-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .product-features {
      list-style: none;
      margin-bottom: 24px;
    }

    .product-features li {
      font-size: 0.88rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .product-features li svg {
      color: var(--primary);
      flex-shrink: 0;
    }

    .card-link {
      color: var(--primary);
      font-weight: 700;
      font-size: 0.92rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: gap 0.2s;
    }

    .card-link:hover {
      gap: 10px;
    }

    /* Diferenciais */
    .differentials {
      padding: 100px 0;
      background: #0d121c;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    .diff-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
    }

    .diff-card {
      padding: 28px;
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
    }

    .diff-card h4 {
      font-size: 1.15rem;
      margin: 16px 0 8px;
      font-weight: 700;
    }

    .diff-card p {
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    /* Depoimentos */
    .reviews {
      padding: 100px 0;
    }

    .reviews-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 28px;
    }

    .review-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .review-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .review-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e293b, #334155);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--accent);
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .review-info h5 {
      font-size: 1rem;
      font-weight: 700;
    }

    .review-info span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .review-text {
      color: #cbd5e1;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 20px;
      font-style: italic;
    }

    /* Localização e Contato */
    .location-section {
      padding: 100px 0;
      background: #0d121c;
      border-top: 1px solid var(--border);
    }

    .location-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: var(--shadow-soft);
    }

    .location-details {
      padding: 48px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .location-details h3 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 20px;
      letter-spacing: -0.02em;
    }

    .location-items {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: 28px 0;
    }

    .loc-item {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .loc-icon {
      color: var(--primary);
      margin-top: 3px;
      flex-shrink: 0;
    }

    .loc-text strong {
      display: block;
      color: #fff;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    .loc-text span {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .location-map-wrap {
      background: #172033;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 380px;
      padding: 40px;
      text-align: center;
      background-image: radial-gradient(#1e293b 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .map-card-inner {
      background: rgba(11, 15, 23, 0.9);
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: var(--radius-md);
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* FAQ */
    .faq {
      padding: 100px 0;
    }

    .faq-list {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .faq-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .faq-item.active {
      border-color: rgba(16, 185, 129, 0.4);
      background: var(--bg-card-hover);
    }

    .faq-question {
      padding: 20px 24px;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.05rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .faq-question svg {
      transition: transform 0.3s ease;
      color: var(--primary);
    }

    .faq-item.active .faq-question svg {
      transform: rotate(180deg);
    }

    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      padding: 0 24px;
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .faq-item.active .faq-answer {
      padding-bottom: 22px;
    }

    /* CTA Final */
    .final-cta {
      padding: 100px 0;
      position: relative;
      overflow: hidden;
    }

    .cta-container {
      background: linear-gradient(135deg, #12202f 0%, #0c1822 100%);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 28px;
      padding: 64px 40px;
      text-align: center;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .cta-container h2 {
      font-size: clamp(2rem, 3.8vw, 3rem);
      font-weight: 800;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }

    .cta-container p {
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 36px auto;
      font-size: 1.1rem;
    }

    /* Footer */
    .footer {
      background: #080b11;
      padding: 70px 0 30px;
      border-top: 1px solid var(--border);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 50px;
      margin-bottom: 50px;
    }

    .footer-col p {
      color: var(--text-muted);
      margin-top: 14px;
      font-size: 0.92rem;
      max-width: 320px;
    }

    .footer-col h4 {
      font-size: 1rem;
      margin-bottom: 20px;
      font-weight: 700;
      color: #fff;
    }

    .footer-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .footer-links a {
      color: var(--text-muted);
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: var(--primary);
    }

    .footer-bottom {
      border-top: 1px solid var(--border);
      padding-top: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* Floating WhatsApp Button */
    .floating-whatsapp {
      position: fixed;
      bottom: 30px;
      right: 30px;
      z-index: 999;
      background: #25d366;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 10px 25px rgba(37, 211, 102, 0.4);
      transition: transform 0.3s ease;
    }

    .floating-whatsapp:hover {
      transform: scale(1.1);
    }

    .floating-whatsapp::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #25d366;
      opacity: 0.6;
      z-index: -1;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.6;
      }
      70% {
        transform: scale(1.5);
        opacity: 0;
      }
      100% {
        transform: scale(1.6);
        opacity: 0;
      }
    }

    /* Responsive */
    @media (max-width: 992px) {
      .hero-grid {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .hero-content p {
        margin: 0 auto 36px auto;
      }
      .hero-actions {
        justify-content: center;
      }
      .social-proof-strip {
        justify-content: center;
      }
      .location-box {
        grid-template-columns: 1fr;
      }
      .footer-grid {
        grid-template-columns: 1fr;
        gap: 36px;
      }
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }
      .mobile-menu-btn {
        display: block;
      }
      .nav-actions {
        display: none;
      }
      .floating-feature {
        display: none;
      }
      .hero {
        padding: 130px 0 60px;
      }
      .location-details {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>

  <!-- Header / Navbar -->
  <header class="navbar" id="navbar">
    <div class="container nav-container">
      <a href="#" class="logo">
        <div class="logo-icon">L</div>
        <span>Lucaflex Cade
